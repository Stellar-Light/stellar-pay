# Gate every push and PR. Until now the only CI was the publish job, so a
# regression could reach main — and npm — without a single test running.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }

jobs:
  check:
    # The OS secret store differs per platform (Keychain / libsecret / DPAPI),
    # so the store test only means something if it runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows currently trips a libuv assertion in a test's process teardown
    # (not in the code under test); advisory until it can be run on a real box.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libsecret (Linux OS store)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx biome check .
      - run: npm run build

      # Offline proofs — no network, no wallet, no testnet.
      - run: npm run test:units
      - run: npm run test:policy
      - run: npm run test:pin       # bait-and-switch pins
      - run: npm run test:hostile   # seller-controlled headers
      - run: npm run test:redirect  # redirects cannot escape the gates
      - run: npm run test:catalog  # the catalog's own claim
      - run: npm run test:send     # send_usdc guards (no funds move)
      - run: npm run test:ssrf
      - run: npm run test:scrimp
      - run: npm run test:keystore
      - run: npm run test:osstore  # exercises the real OS store on each runner
      - run: npm run test:keychain  # macOS-only; SKIPs on the linux runner

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # SECURITY.md claimed full-history secret scanning ran in CI; it never
      # existed until this job. Uses the gitleaks BINARY, not the marketplace
      # action — the action requires a paid licence for organisation repos.
      - name: gitleaks (full history)
        run: |
          VER=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --no-banner --redact
