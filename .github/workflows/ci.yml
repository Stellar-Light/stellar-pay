# Gate every push and PR. Until now the only CI was the publish job, so a
# regression could reach main — and npm — without a single test running.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  check:
    # The OS secret store differs per platform (Keychain / libsecret / DPAPI),
    # so the store test only means something if it runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hang must never hold a runner for GitHub's 6-hour default again: on
    # 2026-09-01 five macOS jobs stuck on an interactive Keychain dialog held
    # the org's entire macOS concurrency allowance, and every later macOS job
    # showed "Waiting for a runner" — our own jobs were the runners.
    timeout-minutes: 20
    env:
      # Honoured only on darwin AND only when GitHub sets GITHUB_ACTIONS; see
      # src/sandbox/keychain-check.ts and the -T note in src/pay/keystore.ts.
      STELLAR_PAY_KEYCHAIN_HEADLESS: "1"
    # Windows is BLOCKING as of 2026-08-30. It was advisory because two real
    # bugs made it permanently red — a libuv assertion in a test's teardown,
    # and an OS-store backend that had never once worked — and an advisory job
    # is how both stayed invisible: three failures were stacked, each hiding
    # the next. All three are fixed and the job passes 7/7 on Windows DPAPI, so
    # the flag comes off. A red Windows job should stop a merge now.
    steps:
      - uses: actions/checkout@v4
      - name: Install libsecret (Linux OS store)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx biome check .
      - run: npm run build

      # Offline proofs — no network, no wallet, no testnet.
      - run: npm run test:units
      - run: npm run test:policy
      - run: npm run test:pin       # bait-and-switch pins
      - run: npm run test:hostile   # seller-controlled headers
      - run: npm run test:redirect  # redirects cannot escape the gates
      - run: npm run test:guards    # every paying door runs the SAME gate
      - run: npm run test:ledger    # deletion is caught, not just editing
      - run: npm run test:feed-tamper # a hostile feed cannot retarget the inbox
      - run: npm run test:second-party # a stranger can implement our formats
      - run: npm run test:vectors     # published vectors match the implementation
      - run: npm run test:vault-key   # the owner key is not plaintext beside the agent key
      - run: npm run test:catalog  # the catalog's own claim
      - run: npm run test:send     # send_usdc guards (no funds move)
      - run: npm run test:ssrf
      - run: npm run test:scrimp
      - run: npm run test:keystore
      - run: npm run test:osstore  # exercises the real OS store on each runner
      - run: npm run test:keychain  # macOS-only; SKIPs elsewhere; headless on CI (see file)


  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # SECURITY.md claimed full-history secret scanning ran in CI; it never
      # existed until this job. Uses the gitleaks BINARY, not the marketplace
      # action — the action requires a paid licence for organisation repos.
      - name: gitleaks (full history)
        run: |
          VER=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git . --no-banner --redact
