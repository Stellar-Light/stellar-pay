name: Probe the index

# Liveness is the product: agent endpoints are demos far more often than
# products, so an index that is never re-probed becomes a list of dead links
# within a quarter. ~210 plain HTTP requests against the endpoints
# themselves (~900 now, mpp-router included); no rate-limited API.

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually write. Unchecked = dry run."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Probe
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.execute }}" = "true" ]; then
            npx tsx src/probe.ts --execute
          else
            npx tsx src/probe.ts
          fi
