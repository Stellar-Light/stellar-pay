# Cut a GitHub Release once a version is actually on the npm registry.
#
# Gated on the REGISTRY, never on a tag push, so a Release can never point at
# a version that failed to publish. Fires instantly when CI publishes, and a
# 6-hourly sweep catches versions published by any other route (a manual
# `npm publish`, a re-run). Idempotent — skips if the tag already exists.
name: release

on:
  # Instant: the moment CI publishes.
  workflow_run:
    workflows: ["publish-npm"]
    types: [completed]
  # Self-healing: catches versions published by ANY route (a manual
  # `npm publish` from a laptop, a re-run, a fixed OIDC config) that never
  # got a Release. Cheap — it exits in seconds when there is nothing to do.
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch: # manual re-cut

permissions:
  contents: write

# Two of the four triggers fire on the SAME release (push on package.json and
# workflow_run after publish), so two runs raced: both passed the "already
# released?" check, both waited for npm, both tagged, and the loser painted a
# failure with `Release.tag_name already exists` (0.1.14, 2026-09-01). This
# serializes them. cancel-in-progress stays false on purpose: the second run
# must still execute and take the idempotent exit, not be dropped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Every trigger is allowed EXCEPT a workflow_run whose publish failed
    # (nothing new would be on the registry in that case).
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + full history for the notes range

      - name: Read the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cut the release if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released — nothing to do"
            exit 0
          fi
          # Confirm the version is actually on the registry before tagging it.
          # RETRY: the `push` trigger fires the same instant publish-npm starts,
          # and the registry needs a moment to serve a just-published version —
          # so a single check loses the race and the Release silently never gets
          # cut (0.1.9 needed a manual workflow_dispatch for exactly this).
          # ~2 minutes of patience, then leave it to the 6-hourly sweep.
          for i in $(seq 1 12); do
            if npm view "stellar-pay@$VERSION" version >/dev/null 2>&1; then
              echo "stellar-pay@$VERSION is on the registry"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "stellar-pay@$VERSION is not on npm after ~2min — leaving it to the scheduled sweep"
              exit 0
            fi
            sleep 10
          done
          git tag "$TAG" 2>/dev/null || true # a concurrent run may have tagged first
          git push origin "$TAG"
          # Re-check right before creating: the check at the top of this step
          # can pass in two runs at once (see the concurrency note up top), and
          # the registry wait above is exactly the window they collide in.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG was released by a concurrent run — nothing to do"
            exit 0
          fi
          # --generate-notes auto-detects the previous tag as the range start.
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          echo "released $TAG"
