# Publish stellar-pay to npm on a version bump.
#
# Auth is Trusted Publishing (OIDC), NOT a token: npm OTP-walls token publishes
# on 2FA accounts, so NPM_TOKEN cannot work here. This needs a one-time
# per-package trusted-publisher config on npmjs.com pointing at this repo and
# this workflow filename. Provenance is free and automatic under OIDC.
name: publish-npm

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

jobs:
  # The macOS gate is BACK (2026-09-01, same day it was removed). The note
  # that used to sit here said macOS jobs had never once completed in this
  # repo. That was wrong: they were assigned within seconds — and then hung
  # on our own keychain test's interactive dialog until five of them held the
  # org's entire macOS concurrency allowance, which is what made every later
  # job look like "no runner ever arrives". With the test headless on CI and
  # a timeout on the job, a Keychain regression must not reach npm: this
  # blocks the only irreversible step, and it can no longer block forever.
  macos-gate:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      STELLAR_PAY_KEYCHAIN_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
      - run: npm run test:keystore
      - run: npm run test:osstore
      - run: npm run test:keychain

  publish:
    needs: macos-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted Publishing needs npm >= 11.5.1; the bundled one is older.
      - run: |
          npm i -g npm@latest
          echo "npm $(npm -v)"  # must be >= 11.5.1 for OIDC

      - run: npm ci

      # Never publish something that doesn't compile or whose proofs fail.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:units
      - run: npm run test:policy
      - run: npm run test:ssrf
      - run: npm run test:scrimp
      # The gates the 2026-09-01 audit added. A publish that skips them would
      # ship exactly the classes it just closed.
      - run: npm run test:guards
      - run: npm run test:ledger
      - run: npm run test:pin
      - run: npm run test:feed-tamper

      # Guard: abort if this ever runs from the wrong package (a wrong-CWD
      # publish once put an entire unrelated app on the registry).
      - name: Guard package identity
        run: |
          node -e "
          const p = require('./package.json');
          if (p.name !== 'stellar-pay') { console.error('WRONG PACKAGE: ' + p.name); process.exit(1); }
          if (p.private) { console.error('package is private'); process.exit(1); }
          console.log('publishing ' + p.name + '@' + p.version);
          "

      # Skip silently if this version is already on the registry, so an
      # unrelated package.json edit doesn't fail the run.
      - name: Publish if the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already published — nothing to do"
          else
            npm publish --access public --loglevel http
          fi
